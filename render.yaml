# Render Blueprint — standby deployment of checkout-server.
#
# Purpose: an independent copy of this app, usable if the VPS goes down.
#
# Database: Neon Postgres — NOT a Render-managed database. This deployment
# connects to the same Neon project the VPS's sync writes into, so the
# standby starts with the real synced data already in place. The connection
# is a single DB_URL env var (a full connection string, pasted in manually
# on both checkout-web and checkout-worker — it's a secret, so it's never
# committed to this file). config.py normalizes its scheme and translates
# Neon's `?sslmode=require` into asyncpg's `ssl=` automatically.
#
# Deploy: connect this repo in the Render dashboard → "New +" → "Blueprint".
# Render reads this file automatically. A few envVars marked `sync: false`
# below need real values pasted in during the first deploy (secrets are
# deliberately never written into this file, since it's committed to git) —
# see RENDER_DEPLOY.md for the exact list.

services:
  # ─── Redis — Celery broker/result-backend + rate-limit cache ─────────────
  # Not the source of truth for anything (Neon Postgres is) — losing this
  # data on a restart just means in-flight background tasks and rate-limit
  # counters reset, not real data loss. ipAllowList: [] = no public access,
  # internal Render network only.
  - name: checkout-redis
    type: keyvalue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction   # never silently drop a queued task

  # ─── Web — the FastAPI app itself ─────────────────────────────────────────
  - name: checkout-web
    type: web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.10
      # Neon connection string — the same Neon DB the VPS sync writes into.
      # Use Neon's DIRECT (non `-pooler`) string: asyncpg's prepared
      # statements don't survive Neon's PgBouncer transaction pooling.
      # The trailing ?sslmode=require can stay — config.py translates it
      # for asyncpg.
      - key: DB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: checkout-redis
          type: keyvalue
          property: connectionString
      - key: ENVIRONMENT
        value: production
      # Update to this service's real onrender.com URL (or a custom domain)
      # after the first deploy — used to build links in outgoing emails etc.
      - key: BASE_URL
        value: https://checkout-web.onrender.com
      # Admin dashboard login — required for the app to be usable at all.
      # Can differ from the VPS's admin credentials if you want that.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      # Every payment-processor/integration credential (Shopify, Stripe,
      # Helcim, Shippo, BTCPay, WPay, pymtz, NowPayments, Resend, Gmail,
      # ...) is deliberately NOT declared here. Each one already defaults
      # to blank/disabled in config.py exactly like an unconfigured .env
      # on any other environment — the app runs fine without them, those
      # specific features just stay off until you add real values in the
      # Render dashboard. Add only the ones you actually need for standby
      # use; see RENDER_DEPLOY.md for the full reference list.

  # ─── Worker — Celery worker + embedded beat (scheduled tasks) ────────────
  # `-B` runs the scheduler inside the same worker process — simplest setup
  # for a single, non-autoscaled standby instance. Do NOT scale this
  # service beyond 1 instance without splitting beat into its own service
  # first, or scheduled tasks (expire-old-orders) will fire once per
  # instance instead of once total.
  - name: checkout-worker
    type: worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks.celery_app worker -B --loglevel=info
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.10
      # Same DB_URL as checkout-web — the same Neon database.
      - key: DB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: checkout-redis
          type: keyvalue
          property: connectionString
      - key: ENVIRONMENT
        value: production
